[project]
name = "focus-tracker-server"
version = "0.1.0"
description = "StudyBand motion processing, data analysis, and leaderboard dashboard"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.136",
    "uvicorn>=0.30,<0.42",
    "jinja2>=3.1,<4",
    "python-dotenv>=1,<2",
    "websockets>=13,<17",
    "paho-mqtt>=2.1,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pyserial>=3.5,<4",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
]

[tool.uv]
# Run scripts from this directory; ECE16Lib is imported from the source tree.
package = false
